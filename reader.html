<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reader</title>
<style>
:root{--ground:#F6F8F7;--surface:#FFF;--alt:#EDF2F1;--line:#D3DDDB;--ink:#121A19;--muted:#57635F;
--faint:#7C8783;--accent:#10555A;--accentSoft:#DCEBEA;--warn:#8A6210;--warnSoft:#F6EEDA;--crit:#9A302A;
--fB:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--fM:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ground:#0D1413;--surface:#141D1C;--alt:#1B2625;
--line:#2C3937;--ink:#E4EBE9;--muted:#9AA8A4;--faint:#74827E;--accent:#63C6C2;--accentSoft:#16302F;
--warn:#D9AC4E;--warnSoft:#2B2415;--crit:#E08078}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--fB);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);
padding:.5rem .6rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
button,a.btn{font:inherit;font-size:.85rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);
border-radius:6px;padding:.45rem .6rem;min-height:2.6rem;min-width:2.6rem;cursor:pointer;text-decoration:none;
display:inline-flex;align-items:center;justify-content:center}
a.btn.p,button.p{background:var(--accent);color:var(--ground);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#name{flex:1 1 7rem;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#pg{font-family:var(--fM);font-size:.8rem;color:var(--muted);white-space:nowrap}
#pgin{width:3.4rem;font:inherit;font-family:var(--fM);font-size:.8rem;text-align:right;padding:.4rem;
background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;min-height:2.6rem}
main{padding:.6rem .4rem 6rem;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.pgw{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pgw canvas{display:block}
.ph{display:flex;align-items:center;justify-content:center;color:var(--faint);font-family:var(--fM);font-size:.75rem;height:100%}
.textLayer{position:absolute;left:0;top:0;overflow:hidden;line-height:1;opacity:1;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(16,85,90,.35)}
@media (prefers-color-scheme:dark){.textLayer ::selection{background:rgba(99,198,194,.4)}}
#msg{padding:2.5rem 1.2rem;text-align:center;color:var(--muted);max-width:32rem;margin:0 auto;line-height:1.6}
#msg code{background:var(--alt);padding:.1rem .3rem;border-radius:3px;font-size:.85em;word-break:break-all}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
padding:.6rem .7rem;display:flex;gap:.5rem;align-items:center;box-shadow:0 -6px 20px -12px rgba(0,0,0,.4)}
#selbar .snip{flex:1;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;z-index:40;background:var(--ground);
border-top:1px solid var(--line);border-radius:14px 14px 0 0;display:flex;flex-direction:column;
box-shadow:0 -10px 40px -18px rgba(0,0,0,.55)}
#sheet header{position:static;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
#sheetBody{overflow-y:auto;padding:.9rem 1rem 1.2rem;flex:1}
.quote{background:var(--alt);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:.6rem .8rem;
font-size:.82rem;color:var(--muted);margin-bottom:.9rem;max-height:7rem;overflow:auto;white-space:pre-wrap}
.ans h3{font-size:.92rem;margin:1rem 0 .3rem;color:var(--accent)}
.ans>h3:first-child{margin-top:0}
.ans p{margin:.5rem 0;line-height:1.6}.ans ul,.ans ol{margin:.5rem 0;padding-left:1.2rem}.ans li{margin:.25rem 0}
.ans code{font-family:var(--fM);font-size:.87em;background:var(--alt);padding:.1rem .32rem;border-radius:3px}
.ans pre{background:var(--alt);padding:.75rem;border-radius:6px;overflow-x:auto}
.ans pre code{background:none;padding:0;font-size:.82rem}
.err{border:1px solid var(--crit);border-left:3px solid var(--crit);border-radius:0 6px 6px 0;
padding:.8rem .9rem;font-size:.9rem;margin-top:.6rem;background:var(--surface)}
.note{background:var(--warnSoft);border-left:3px solid var(--warn);border-radius:0 6px 6px 0;
padding:.7rem .85rem;font-size:.82rem;margin-top:.8rem}
.note b{color:var(--warn)}
.fu{display:flex;gap:.5rem;padding:.6rem 1rem .9rem;border-top:1px solid var(--line);background:var(--ground)}
.fu input{flex:1;font:inherit;font-size:.9rem;background:var(--surface);color:var(--ink);
border:1px solid var(--line);border-radius:8px;padding:.6rem;min-height:2.7rem}
[hidden]{display:none!important}
</style></head><body>
<header>
  <a class="btn" id="lib" href="./index.html" title="Library">&#9776;</a>
  <span id="name">Loading…</span>
  <button id="out" title="Zoom out">&minus;</button><button id="in" title="Zoom in">+</button>
  <input id="pgin" type="number" min="1" value="1" aria-label="Page number">
  <span id="pg">/ &ndash;</span>
  <a class="btn p" id="dl" download>Download</a>
</header>
<main id="main"><div id="msg">Loading…</div></main>

<div id="selbar" hidden>
  <span class="snip" id="snip"></span>
  <button class="p" id="explain">Explain this</button>
</div>

<div id="sheet" hidden>
  <header>
    <span id="name2" style="flex:1;font-size:.8rem;color:var(--muted)">Explanation</span>
    <button id="stop" hidden>Stop</button>
    <button id="close">Close</button>
  </header>
  <div id="sheetBody"></div>
  <div class="fu" id="fuBar" hidden>
    <input id="fu" placeholder="Ask a follow-up…">
    <button class="p" id="fuGo">Ask</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="./ai.js"></script>
<script>
(function(){
var L=window["pdfjs-dist/build/pdf"]||window.pdfjsLib;
L.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var q=new URLSearchParams(location.search), file=q.get("f")||"";
var main=document.getElementById("main"), msg=document.getElementById("msg");
function $(i){return document.getElementById(i);}
if(!file){msg.innerHTML="No file given. Open a book from the <a href='./index.html'>library</a>.";return;}
var short=file.split("/").pop().replace(/\.pdf$/,"");
$("name").textContent=short; document.title=short+" — Reader";
$("dl").href=file;
var KEYP="pg:"+file, doc=null,N=0,wraps=[],done={},obs=null,base=1,zoom=1,vp1=null;
try{zoom=parseFloat(localStorage.getItem("zoom")||"1")||1;}catch(e){}
function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function width(){return Math.min(main.clientWidth-8, 1100);}

function build(){
  main.innerHTML=""; wraps=[]; done={};
  base=width()/vp1.width;
  var s=base*zoom, w=vp1.width*s, h=vp1.height*s;
  for(var i=1;i<=N;i++){
    var d=document.createElement("div");
    d.className="pgw"; d.dataset.p=i;
    d.style.width=w+"px"; d.style.height=h+"px";
    d.innerHTML='<div class="ph">page '+i+"</div>";
    main.appendChild(d); wraps.push(d);
  }
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var p=+e.target.dataset.p;
      draw(p); $("pgin").value=p; store(KEYP,p);
    });
  },{rootMargin:"200% 0px",threshold:0});
  wraps.forEach(function(d){obs.observe(d);});
}

function draw(p){
  if(done[p])return; done[p]=1;
  var wrap=wraps[p-1]; if(!wrap)return;
  doc.getPage(p).then(function(page){
    var s=base*zoom, dpr=window.devicePixelRatio||1;
    var cssVp=page.getViewport({scale:s});
    var c=document.createElement("canvas");
    c.width=Math.floor(cssVp.width*dpr); c.height=Math.floor(cssVp.height*dpr);
    c.style.width=cssVp.width+"px"; c.style.height=cssVp.height+"px";
    return page.render({canvasContext:c.getContext("2d"),
      viewport:page.getViewport({scale:s*dpr})}).promise.then(function(){
      wrap.style.width=cssVp.width+"px"; wrap.style.height=cssVp.height+"px";
      wrap.innerHTML=""; wrap.appendChild(c);
      var tl=document.createElement("div");
      tl.className="textLayer";
      tl.style.width=cssVp.width+"px"; tl.style.height=cssVp.height+"px";
      wrap.appendChild(tl);
      return page.getTextContent().then(function(tc){
        var task=L.renderTextLayer({textContentSource:tc,textContent:tc,
          container:tl,viewport:cssVp,textDivs:[]});
        return task&&task.promise?task.promise:null;
      });
    });
  }).catch(function(){done[p]=0;});
}

L.getDocument(file).promise.then(function(d){
  doc=d; N=d.numPages;
  $("pg").textContent="/ "+N; $("pgin").max=N;
  return d.getPage(1);
}).then(function(p1){
  vp1=p1.getViewport({scale:1});
  build();
  var last=parseInt(get(KEYP)||"1",10);
  if(last>1&&last<=N)setTimeout(function(){wraps[last-1].scrollIntoView();},80);
}).catch(function(){
  msg.innerHTML="Could not open <code>"+file+"</code>.<br><br>"+
   "Open it from the site rather than from a local file — browsers block local PDF loading.<br><br>"+
   "<a href='./index.html'>Back to library</a>";
});

function rezoom(d){
  zoom=Math.min(3,Math.max(.6,+(zoom+d).toFixed(2))); store("zoom",zoom);
  var cur=+$("pgin").value||1; build();
  setTimeout(function(){ if(wraps[cur-1])wraps[cur-1].scrollIntoView(); },60);
}
$("in").onclick=function(){rezoom(.2);};
$("out").onclick=function(){rezoom(-.2);};
$("pgin").onchange=function(e){
  var p=Math.max(1,Math.min(N,+e.target.value||1));
  if(wraps[p-1])wraps[p-1].scrollIntoView();
};
var rt=null;
window.addEventListener("resize",function(){
  if(!vp1)return; clearTimeout(rt);
  rt=setTimeout(function(){var cur=+$("pgin").value||1;build();
    setTimeout(function(){if(wraps[cur-1])wraps[cur-1].scrollIntoView();},60);},250);
});

/* ---------- selection -> explain ---------- */
var sel="", ctl=null, turns=[];
function currentSelection(){
  var s=window.getSelection();
  if(!s||s.isCollapsed)return "";
  var t=s.toString().replace(/\s+/g," ").trim();
  if(t.length<8)return "";
  var n=s.anchorNode;
  if(n&&!main.contains(n.nodeType===1?n:n.parentNode))return "";
  return t;
}
var st=null;
document.addEventListener("selectionchange",function(){
  clearTimeout(st);
  st=setTimeout(function(){
    if(!$("sheet").hidden)return;
    sel=currentSelection();
    if(sel){ $("snip").textContent=sel.slice(0,120)+(sel.length>120?"…":""); $("selbar").hidden=false; }
    else $("selbar").hidden=true;
  },180);
});

function openSheet(){
  $("selbar").hidden=true; $("sheet").hidden=false;
  $("sheetBody").innerHTML='<div class="quote">'+GateAI.esc(sel)+"</div>"+
    '<div class="ans" id="ans"><p>Thinking…</p></div>';
  $("fuBar").hidden=true;
  if(!GateAI.hasKey()){
    $("ans").innerHTML='<p>To explain passages here, set up a free Google AI Studio key once — '+
      'it takes two minutes and stays on this device.</p>'+
      '<p><a class="btn p" href="./tutor.html">Set up the key</a></p>'+
      '<p style="font-size:.85rem;color:var(--muted)">Or use <b>Copy passage</b> below and paste it into any AI app.</p>'+
      '<p><button id="cp">Copy passage prompt</button></p>';
    var b=document.getElementById("cp");
    if(b)b.onclick=function(){
      var p=GateAI.promptPassage(sel,"in "+short);
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(p).then(function(){b.textContent="Copied";},function(){b.textContent="Copy failed";});
    };
    return;
  }
  turns=[{role:"user",parts:[{text:GateAI.promptPassage(sel,"in "+short)}]}];
  send();
}
function send(){
  var ans=$("ans"); ctl=new AbortController();
  $("stop").hidden=false; $("fuBar").hidden=true;
  GateAI.ask(turns,function(t){ans.innerHTML=GateAI.md(t);},ctl.signal)
  .then(function(text){
    ans.innerHTML=GateAI.md(text);
    turns.push({role:"model",parts:[{text:text}]});
    ans.insertAdjacentHTML("beforeend",
      '<div class="note"><b>Verify anything exact.</b> Complexities, closure properties and edge cases are '+
      'where AI goes subtly wrong — and where GATE scores you.</div>');
    $("fuBar").hidden=false;
  })
  .catch(function(e){
    if(e&&e.partial){ans.innerHTML=GateAI.md(e.partial);turns.push({role:"model",parts:[{text:e.partial}]});}
    var m=GateAI.errMsg(e);
    if(m)ans.insertAdjacentHTML("beforeend",'<div class="err">'+m+"</div>");
    $("fuBar").hidden=false;
  })
  .then(function(){$("stop").hidden=true;ctl=null;});
}
$("explain").onclick=openSheet;
$("stop").onclick=function(){if(ctl)ctl.abort();};
$("close").onclick=function(){
  if(ctl)ctl.abort();
  $("sheet").hidden=true; turns=[];
  try{window.getSelection().removeAllRanges();}catch(e){}
};
$("fuGo").onclick=function(){
  var v=$("fu").value.trim(); if(!v)return;
  $("fu").value="";
  turns.push({role:"user",parts:[{text:v}]});
  $("sheetBody").insertAdjacentHTML("beforeend",
    '<div class="quote" style="border-left-color:var(--muted)">'+GateAI.esc(v)+"</div>"+
    '<div class="ans" id="ans2"><p>Thinking…</p></div>');
  var prev=$("ans"); if(prev)prev.id="ansOld";
  document.getElementById("ans2").id="ans";
  $("sheetBody").scrollTop=$("sheetBody").scrollHeight;
  send();
};
$("fu").addEventListener("keydown",function(e){if(e.key==="Enter")$("fuGo").click();});
})();
</script></body></html>
