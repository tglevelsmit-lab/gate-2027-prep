const K=["date","phase","week","main","second","apt","revise","flag"];
const rows=PLAN.map(a=>Object.fromEntries(K.map((k,i)=>[k,a[i]])));
const byDate=Object.fromEntries(rows.map((r,i)=>[r.date,i]));
const MIN=rows[0].date, MAX=rows[rows.length-1].date;
let i=0;
const $=id=>document.getElementById(id);
const iso=d=>d.toISOString().slice(0,10);
function todayIdx(){
  const t=iso(new Date());
  if(byDate[t]!==undefined) return byDate[t];
  return t<MIN?0:rows.length-1;
}
function store(k,v){try{v===undefined?null:localStorage.setItem(k,v);}catch(e){}}
function read(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function fmt(s){const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
function render(){
  const r=rows[i];
  $("dlab").textContent=fmt(r.date);
  $("plab").textContent=r.phase;
  $("wk").textContent=r.week||r.phase;
  $("task").textContent=r.main;
  const b=[["Maths",r.second],["Aptitude",r.apt],["Revise",r.revise]]
    .filter(x=>x[1]).map(x=>`<div class="row"><div class="k">${x[0]}</div><div>${x[1]}</div></div>`).join("");
  $("blocks").innerHTML=b||`<div class="row"><div>Nothing scheduled alongside today.</div></div>`;
  $("blocks").hidden=!b;
  $("flagBox").innerHTML=r.flag?`<div class="flag"><b>Flag</b>${r.flag}</div>`:"";
  const fs=FILES[r.week]||[];
  $("files").innerHTML=fs.length?fs.map(f=>
    `<a class="file" href="${f.u}" target="_blank" rel="noopener">
      <span class="tag ${f.k==="book"?"b":""}">${f.k==="book"?"Book":"Q's"}</span>
      <span>${f.n.replace(/\.pdf$/,"").replace(/--BOOK-.*/,"")}</span></a>`).join("")
    : `<p style="color:var(--faint);font-size:.9rem;margin:0">No week-tagged files — see the repo folder for this phase.</p>`;
  const pct=Math.round((i+1)/rows.length*100);
  $("pbar").style.width=pct+"%";
  $("pnum").textContent=pct+"% of the plan";
  $("pdays").textContent=`day ${i+1} / ${rows.length}`;
  $("jump").value=r.date;
  const done=read("done:"+r.date)==="1";
  $("chk").checked=done;
  $("chkl").textContent=done?"Done":"Mark this day done";
}
$("prev").onclick=()=>{i=Math.max(0,i-1);render();};
$("next").onclick=()=>{i=Math.min(rows.length-1,i+1);render();};
$("today").onclick=()=>{i=todayIdx();render();};
$("jump").onchange=e=>{const v=byDate[e.target.value];if(v!==undefined){i=v;render();}};
$("chk").onchange=e=>{store("done:"+rows[i].date,e.target.checked?"1":"0");render();};
i=todayIdx();render();
</script>
